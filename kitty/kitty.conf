# ╔══════════════════════════════════════════════════════╗
# ║     kitty.conf — Rimuru Tempest · 転生したらスライム ║
# ║     ciano · dourado · preto · branco gelo            ║
# ╚══════════════════════════════════════════════════════╝

# ── Font ─────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

# ── Cursor ───────────────────────────────────────────────
# Ciano elétrico — cabelo da Rimuru
cursor                     #38c8e8
cursor_text_color          #0a0e14
cursor_shape               block
cursor_blink_interval      0.4
cursor_stop_blinking_after 0

# ── Scrollback ───────────────────────────────────────────
scrollback_lines           5000

# ── Mouse ────────────────────────────────────────────────
mouse_hide_wait            2.0
focus_follows_mouse        no

# ── Performance ──────────────────────────────────────────
repaint_delay              10
input_delay                3
sync_to_monitor            yes

# ── Bell ─────────────────────────────────────────────────
enable_audio_bell          no
visual_bell_duration       0.0

# ── Window ───────────────────────────────────────────────
remember_window_size       yes
initial_window_width       120c
initial_window_height      34c
window_padding_width       14
window_border_width        2px
draw_minimal_borders       yes
active_border_color        #38c8e8
inactive_border_color      #0e1e2a
placement_strategy         center
hide_window_decorations    no
background_opacity         0.96

# ── Tab bar ──────────────────────────────────────────────
tab_bar_edge               bottom
tab_bar_style              powerline
tab_powerline_style        slanted
tab_title_template         " {index}: {title} "
active_tab_font_style      bold
inactive_tab_font_style    normal

# ── Cores principais ─────────────────────────────────────
# Paleta da imagem:
#   #38c8e8 → ciano elétrico — cabelo
#   #c8b858 → amarelo-dourado — olhos
#   #0a0e14 → preto azulado — jaqueta
#   #e8eef8 → branco gelo — camisa / fur
#   #1a3040 → azul petróleo — sombras da jaqueta

background              #0a0e14
foreground              #c8daf0

selection_background    #0e2a3a
selection_foreground    #e8f4ff

url_color               #38c8e8
url_style               curly

# ── Paleta 16 cores ──────────────────────────────────────

# Pretos — preto azulado da jaqueta
color0   #0a0e14
color8   #1a2a38

# Vermelhos — substituídos por ciano escuro (sem vermelho)
color1   #1a5a6a
color9   #2a7a8a

# Verdes — azul petróleo médio
color2   #1e4a5a
color10  #2a6070

# Amarelos — dourado dos olhos
color3   #c8b858
color11  #e0d070

# Azuis — ciano principal
color4   #1e6888
color12  #38c8e8

# Magentas — azul gelo frio
color5   #5a9ac0
color13  #8abcdc

# Cianos — ciano claro brilhante
color6   #30a8c8
color14  #60d8f0

# Brancos — branco gelo da camisa/fur
color7   #b8cce8
color15  #e8f4ff

# Tab bar
active_tab_background   #0e2a3a
active_tab_foreground   #60d8f0
inactive_tab_background #080c12
inactive_tab_foreground #2a5a70
tab_bar_background      #0a0e14

# ── Keybindings ──────────────────────────────────────────
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+w      close_tab
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+enter  new_window_with_cwd
map ctrl+equal        change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+0            change_font_size all 0

# ── Shell integration ─────────────────────────────────────
shell_integration      enabled

# ── Misc ─────────────────────────────────────────────────
close_on_child_death   no
allow_remote_control   yes
term                   xterm-kitty
